name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build APK
        run: |
          cd "惩罚者 PUBG 4.4.0/惩罚者 PUBG 4.4.0"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "惩罚者 PUBG 4.4.0/惩罚者 PUBG 4.4.0/app/build/outputs/apk/debug/*.apk"
